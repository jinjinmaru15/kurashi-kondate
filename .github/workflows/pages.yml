name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 文法チェック
        run: |
          node --check app.js
          node --check sw.js
          node --check config.js
          python3 -c "import json; json.load(open('manifest.webmanifest'))"

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp index.html styles.css app.js config.js sw.js manifest.webmanifest _site/
          cp -r icons _site/
          BUILD="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/${BUILD}/g" _site/index.html _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
